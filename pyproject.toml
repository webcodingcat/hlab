# The lab image installs the runtime from Debian's packages (Dockerfile), not from here.
# This describes the package for the unit tests outside Docker (DEVELOPING.md, Tests):
# `pip install -e '.[dev]'` in a venv; ruff checks PEP 8 and PEP 257, mypy the types.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hlabd"
version = "0"
description = "HLab: a local stand-in for Hetzner Cloud"
requires-python = ">=3.13"
# the Dockerfile's python3-* packages that hlabd imports
dependencies = ["fastapi", "uvicorn", "pyyaml", "jsonschema", "dnspython"]

[project.optional-dependencies]
# pytest, httpx (FastAPI's test client, itests) and paramiko (itests) come from Debian in
# the dev image; ruff and mypy are pinned as in its dev stage: a new release may report more
dev = ["pytest", "httpx", "paramiko", "ruff==0.17.2", "mypy==2.4.0"]

[tool.setuptools.packages.find]
include = ["hlabd*"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# BLE: a broad `except Exception` needs a reason; RUF100: no unused noqa comments
select = ["E", "W", "F", "I", "N", "D", "BLE", "RUF100"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["hlabd"]

[tool.ruff.lint.per-file-ignores]
# test names are sentences that say what they check
"tests/test_*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"itests/test_*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

# mypy (`mypy hlabd`): annotations are optional, but where they are (`lab: Lab`, the
# record TypedDicts of records.py) they are checked, so a typo in a record key fails.
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# no type stubs in the image (Debian's packages)
module = ["yaml", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# the unit tests; the live tests (itests/) run inside the lab (`bin/hlab itest`)
testpaths = ["tests"]
