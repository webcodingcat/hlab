# The appliance is the lab's router. Redirects stay off on every interface:
# a router that sends them teaches the servers to reach each other directly.
# The links picture switches them off on each interface as well, because the
# kernel sends redirects if "all" or the interface allows them.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
