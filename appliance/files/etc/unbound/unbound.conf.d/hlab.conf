# The lab's resolver for the servers, on the appliance's host link
# addresses (198.18.0.2, 2001:db8:0:ffff::2): it resolves recursively through
# the uplink. The ruleset decides who reaches it. The addresses may appear
# after unbound starts: the agent sets them.
server:
    interface: 127.0.0.1
    interface: 198.18.0.2
    interface: 2001:db8:0:ffff::2
    ip-freebind: yes
    access-control: 0.0.0.0/0 allow
    access-control: ::/0 allow
