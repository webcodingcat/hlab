version: "3"

# Build and test tasks of hlab. Arguments after "--" are passed on, for
# example: task test -- ./internal/store/...   task e2e -- -run 'TestE2E/SRV-01'

vars:
  VERSION: '{{.VERSION | default "dev"}}'
  LDFLAGS: -X github.com/webcodingcat/hlab/internal/version.Version={{.VERSION}} -X github.com/webcodingcat/hlab/internal/profile.Name=dev

tasks:
  default:
    cmds:
      - task: build

  frontend:install:
    desc: Install the frontend dependencies
    dir: ui/frontend
    cmds:
      - npm ci

  frontend:build:
    desc: Build the tray frontend into ui/frontend/dist
    dir: ui/frontend
    deps: [frontend:install]
    cmds:
      - npm run build

  build:
    desc: Build all programs into bin/
    deps: [frontend:build]
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/hlabd.exe ./cmd/hlabd
      - go build -ldflags "{{.LDFLAGS}}" -o bin/hlab.exe ./cmd/hlab
      - go build -ldflags "{{.LDFLAGS}} -H windowsgui" -o bin/hlab-tray.exe ./cmd/hlab-tray
      - task: build:agent

  build:agent:
    desc: Build the static Linux binary of hlab-agent into bin/
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/hlab-agent ./cmd/hlab-agent

  installer:
    desc: "Build the release MSI and setup bundle into bin/ (VERSION=x.y.z required; needs WiX 7.0.1 with its util and bal extensions)"
    deps: [frontend:build]
    cmds:
      - go run ./tools/installer {{.VERSION}}

  lint:
    desc: "Lint Go code (default ./..., or the packages after --) and type-check the frontend"
    cmds:
      - golangci-lint run {{.CLI_ARGS | default "./..."}}
      - task: lint:frontend

  lint:frontend:
    desc: Type-check the tray frontend with svelte-check
    dir: ui/frontend
    deps: [frontend:install]
    cmds:
      - npm run check

  test:
    desc: "Run the fast tests (default ./..., or the packages after --)"
    cmds:
      - go test {{.CLI_ARGS | default "./..."}}

  test:frontend:
    desc: Run the frontend unit tests (Playwright Test without a browser)
    dir: ui/frontend
    deps: [frontend:install]
    cmds:
      - npm run test:unit

  openapi:
    desc: Download the pinned Hetzner OpenAPI description into the user cache folder
    cmds:
      - go run ./tools/openapi

  catalog:
    desc: Generate the shipped location, server type, load balancer type and pricing catalogs from the real Hetzner API
    cmds:
      - go run ./tools/catalog

  icons:
    desc: Render the app and tray icons, the .syso icon resources and the SVG artwork (outputs are committed)
    cmds:
      - go run ./tools/icons

  docs:screenshots:
    desc: Render the README screenshots of the tray window into docs/images (needs the dev cloud running)
    deps: [frontend:install]
    cmds:
      - go run ./tools/screenshots

  e2e:
    desc: "Run the end-to-end tests against real Hyper-V and clients; filter with -- -run <regexp>"
    cmds:
      - go test -tags e2e -count=1 -timeout 180m ./test/e2e/... {{.CLI_ARGS}}

  e2e:elevated:
    desc: "Run the elevated installer suite (administrator terminal; refuses while a release hlab is installed); filter with -- -run <regexp>"
    cmds:
      - go test -tags e2einstall -count=1 -timeout 420m ./test/install/... {{.CLI_ARGS}}
