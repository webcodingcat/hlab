---
# Lab configuration. Every key is optional; the values shown are the defaults
# unless marked otherwise.
# Start with:  bin/hlab -c examples/hlab.yaml up

# Name of the lab: container hlab-<name>, state volume hlab-<name>. Several
# labs run side by side, each in its own network namespace (the addresses
# below repeat in every lab).
name: demo

api:
  # Token the fake Cloud API accepts (Authorization: Bearer <token>). null
  # accepts any token. The hcloud provider and CLI insist on 64 characters.
  token: null
  # Factor on the cloud timings (power off ~9 s, reset ~15 s, Floating IP
  # move ~3 s). 0 = instant.
  time_scale: 1.0
  # Requests per hour and token, refilled gradually like on Hetzner (429 when
  # used up). null switches it off.
  rate_limit: 3600

# Server types offered by the API: Hetzner's x86 types in eu-central, each
# in every location. VM size = real size; memory_scale shrinks the RAM of
# every VM (e.g. 0.5) when the Docker host is short of memory – the type
# still reports its real size.
# category: cost_optimized and regular_purpose have shared vCPUs,
# general_purpose dedicated ones. traffic_tb: included traffic.
# price_monthly: EUR without VAT and IPv4; the hourly price is
# price_monthly / 624, rounded as on Hetzner.
memory_scale: 1.0
server_types:
  cx23: {category: cost_optimized, cores: 2, memory_gb: 4, disk_gb: 40,
         traffic_tb: 20, price_monthly: 5.49}
  cx33: {category: cost_optimized, cores: 4, memory_gb: 8, disk_gb: 80,
         traffic_tb: 20, price_monthly: 8.49}
  cx43: {category: cost_optimized, cores: 8, memory_gb: 16, disk_gb: 160,
         traffic_tb: 20, price_monthly: 15.99}
  cx53: {category: cost_optimized, cores: 16, memory_gb: 32, disk_gb: 320,
         traffic_tb: 20, price_monthly: 29.49}
  cpx02: {category: regular_purpose, cores: 1, memory_gb: 1, disk_gb: 20,
          traffic_tb: 20, price_monthly: 5.99}
  cpx12: {category: regular_purpose, cores: 1, memory_gb: 2, disk_gb: 40,
          traffic_tb: 20, price_monthly: 11.49}
  cpx22: {category: regular_purpose, cores: 2, memory_gb: 4, disk_gb: 80,
          traffic_tb: 20, price_monthly: 19.49}
  cpx32: {category: regular_purpose, cores: 4, memory_gb: 8, disk_gb: 160,
          traffic_tb: 20, price_monthly: 35.49}
  cpx42: {category: regular_purpose, cores: 8, memory_gb: 16, disk_gb: 320,
          traffic_tb: 20, price_monthly: 69.49}
  cpx52: {category: regular_purpose, cores: 12, memory_gb: 24, disk_gb: 480,
          traffic_tb: 20, price_monthly: 100.49}
  cpx62: {category: regular_purpose, cores: 16, memory_gb: 32, disk_gb: 640,
          traffic_tb: 20, price_monthly: 129.99}
  ccx13: {category: general_purpose, cores: 2, memory_gb: 8, disk_gb: 80,
          traffic_tb: 20, price_monthly: 42.99}
  ccx23: {category: general_purpose, cores: 4, memory_gb: 16, disk_gb: 160,
          traffic_tb: 20, price_monthly: 85.99}
  ccx33: {category: general_purpose, cores: 8, memory_gb: 32, disk_gb: 240,
          traffic_tb: 30, price_monthly: 138.49}
  ccx43: {category: general_purpose, cores: 16, memory_gb: 64, disk_gb: 360,
          traffic_tb: 40, price_monthly: 275.99}
  ccx53: {category: general_purpose, cores: 32, memory_gb: 128, disk_gb: 600,
          traffic_tb: 50, price_monthly: 533.49}
  ccx63: {category: general_purpose, cores: 48, memory_gb: 192, disk_gb: 960,
          traffic_tb: 60, price_monthly: 853.49}

# Locations and the simulated round-trip time between them (ms), applied on
# the public and private networks.
locations:
  fsn1: {city: Falkenstein, country: DE, network_zone: eu-central}
  nbg1: {city: Nuremberg, country: DE, network_zone: eu-central}
  hel1: {city: Helsinki, country: FI, network_zone: eu-central}
latency_ms:
  fsn1-nbg1: 3
  fsn1-hel1: 24
  hel1-nbg1: 24

# System images by name (as used in "image" when creating a server): the
# current release and its checksum file. The lab loads them when it starts (a
# newer release comes as a new file; servers keep the version they were made
# from). Only these images exist in the lab.
images:
  debian-13:
    url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
    checksums: https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS
  ubuntu-26.04:
    url: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img
    checksums: https://cloud-images.ubuntu.com/releases/26.04/release/SHA256SUMS

# Storage Box stand-in on 198.18.0.1 (box.hlab): SFTP on port 22 (always on),
# SSH (rsync, scp, borg, commands) on port 23 (with ssh_enabled). size_gb
# limits the space (a full box can be tested); it can grow later (the next
# start enlarges the box), not shrink.
storage_box:
  enabled: true
  size_gb: 10

# Storage Box types of the Storage Box API. The API reports size_tb; the lab's
# boxes really share storage_box.size_gb. price_monthly: EUR without VAT.
storage_box_types:
  bx11: {size_tb: 1, snapshots: 10, automatic_snapshots: 10, subaccounts: 100,
         price_monthly: 3.20}
  bx21: {size_tb: 5, snapshots: 20, automatic_snapshots: 20, subaccounts: 100,
         price_monthly: 10.90}
  bx31: {size_tb: 10, snapshots: 30, automatic_snapshots: 30,
         subaccounts: 100, price_monthly: 20.80}
  bx41: {size_tb: 20, snapshots: 40, automatic_snapshots: 40,
         subaccounts: 100, price_monthly: 40.60}

# Prices that /v1/pricing reports besides the types, in EUR without VAT.
pricing:
  vat_rate: 19
  traffic_per_tb: 1.00
  primary_ipv4_monthly: 0.50
  primary_ipv6_monthly: 0.00
  floating_ipv4_monthly: 3.00
  floating_ipv6_monthly: 1.00
  volume_per_gb_monthly: 0.044
  image_per_gb_monthly: 0.0119
  backup_percent: 20

# Extra DNS answers of the lab resolver (198.18.0.1), e.g. test domains
# pointing at a Floating IP. A name covers its subdomains too.
dns: {}
#  example.test: 203.0.113.10
