---
# Runs what a developer runs: the checks and the unit tests, on Linux (with
# the race detector) and on Windows, for a push to any branch, so that a
# phase branch is checked before it is merged. The live tests need Hyper-V,
# which GitHub's runners do not offer; the smoke tests run at a phase's end
# (DEVELOPING.md, Tools).
name: test

"on":
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# a newer push to the same branch or pull request makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: sudo apt-get install -y shellcheck yamllint
      # pwsh comes with the runner, PSScriptAnalyzer not always
      - shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
      - run: bin/dev lint
      - run: bin/dev test

  # the agent's tests change links and nftables: in a new network namespace,
  # with sudo
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: sudo apt-get install -y busybox dnsmasq-base nftables
      - run: bin/dev test --agent --host

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
      # shellcheck and yamllint run in the Linux job only
      - run: ./bin/dev.ps1 lint
      - run: ./bin/dev.ps1 test
