---
# Compares Hetzner's current specs with those in compat/specs once a week. A
# failed run means Hetzner changed a spec: take it over with
# `bin/dev spec-diff --update` (DEVELOPING.md, Recipes). It runs apart from
# the tests, so that a change at Hetzner does not fail every push.
name: spec-diff

"on":
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bin/dev spec-diff
