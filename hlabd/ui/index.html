<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLab</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <header>
    <h1>HLab <span id="lab-name"></span></h1>
    <p id="notice" class="notice" role="status"></p>
    <p id="connection" class="connection">connecting …</p>
  </header>
  <div class="layout">
    <nav id="sections" aria-label="Sections"></nav>
    <main>
      <h2 id="title"></h2>
      <!-- forms: built once per visit of a section, so polling keeps what is typed -->
      <div id="controls"></div>
      <!-- tables: built anew with every poll -->
      <div id="view"></div>
    </main>
  </div>
  <!-- the servers and clients by name, offered by the forms' target fields -->
  <datalist id="targets"></datalist>
  <script src="/ui.js"></script>
</body>
</html>
